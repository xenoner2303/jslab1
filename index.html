<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <title>JS Lab 1</title>
    <link rel="stylesheet" href="./style.css"/>
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <canvas id="gameCanvas"></canvas>

    <div id="kill-msg"></div>

    <div id="hud">
